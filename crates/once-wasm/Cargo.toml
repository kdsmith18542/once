[package]
name = "once-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
once-hir = { path = "../once-hir" }
once-ty = { path = "../once-ty" }
once-rinf = { path = "../once-rinf" }
once-onceo = { path = "../once-onceo" }
wasmparser = "0.200"
wasm-encoder = "0.30"
wasmtime = "22.0"
wasmtime-wasi = "44.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
