name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        override: true
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build
      run: cargo build --verbose --all --release
    
    - name: Test
      run: cargo test --verbose --all --release
    
    - name: Create release archive
      shell: bash
      run: |
        mkdir -p release
        cp target/release/once release/once-${{ matrix.os }}
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cp target/release/once.exe release/once-windows.exe
        fi
        tar -czf once-${{ matrix.os }}-${{ github.ref_name }}.tar.gz -C release .
    
    - name: Upload release assets
      uses: actions/upload-artifact@v3
      with:
        name: once-${{ matrix.os }}-${{ github.ref_name }}
        path: once-${{ matrix.os }}-${{ github.ref_name }}.tar.gz

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v8
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          once-ubuntu-latest-*/once-ubuntu-latest-*.tar.gz
          once-windows-latest-*/once-windows-latest-*.tar.gz
          once-macos-latest-*/once-macos-latest-*.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
